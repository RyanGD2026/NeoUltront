[package]
name = "neoultront"
version = "0.8.0"
edition = "2024"
description = "A Rust-based font editor"
license = "MIT"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "neoultront"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19.0"
rfd = "0.15.4"

[build-dependencies]
slint-build = "1.19.0"
